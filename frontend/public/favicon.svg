<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background rounded squircle for light & dark environments -->
  <rect width="512" height="512" rx="112" fill="#0A192F"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1E3A5F" stroke-width="4"/>

  <!-- Baseline connection glow / subtle guide track -->
  <line x1="68" y1="256" x2="444" y2="256" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="6 8"/>

  <!-- Top Half of Capsule (Vibrant Healing Teal #14B8A6) -->
  <path d="M 172 256 V 170 A 84 84 0 0 1 340 170 V 256 Z" fill="#14B8A6"/>

  <!-- Bottom Half of Capsule (Medical Trust Blue #2E75B6) -->
  <path d="M 172 256 V 342 A 84 84 0 0 0 340 342 V 256 Z" fill="#2E75B6"/>

  <!-- Minimal Schedule Notch at 12 o'clock -->
  <path d="M 256 100 V 114" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Pill Specular Vector Highlight (Flat, no gradients) -->
  <path d="M 198 140 A 68 68 0 0 1 280 112" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.3"/>

  <!-- Pulse Seam Cutout Halo (Dark navy mask to carve the seam into both halves) -->
  <path d="M 68 256 H 172 L 196 256 L 212 234 L 228 280 L 256 164 L 284 348 L 300 242 L 316 256 L 340 256 H 444"
        fill="none" stroke="#0A192F" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crisp Heartbeat Pulse Line (Brilliant White #FFFFFF) -->
  <path d="M 68 256 H 172 L 196 256 L 212 234 L 228 280 L 256 164 L 284 348 L 300 242 L 316 256 L 340 256 H 444"
        fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Origin Rx Node (Input: Handwritten prescription) -->
  <circle cx="68" cy="256" r="8" fill="#2E75B6"/>
  <circle cx="68" cy="256" r="4" fill="#FFFFFF"/>

  <!-- Reminder Alert Beacon (Output: Timely schedule & caregiver alert) -->
  <circle cx="444" cy="256" r="18" fill="none" stroke="#14B8A6" stroke-width="4"/>
  <circle cx="444" cy="256" r="8" fill="#FFFFFF"/>
</svg>
